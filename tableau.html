<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>ALICE - Application de Localisation des Installations de Conduite des EALE.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/ALICE-BETA/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/ALICE-BETA/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/ALICE-BETA/icons/icon-192.png">
<link rel="shortcut icon" href="/ALICE-BETA/icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/ALICE-BETA/icons/apple-touch-icon.png">
<style>

/* Reset sizing */
*, *::before, *::after {
  box-sizing: border-box;
}

/* Variables theme clair */
:root {
  --bg: var(--alice-panel-soft-light);
  --card-bg: var(--alice-panel-soft-light);

  /* Texte */
  --text: #3c3732;
  --muted: var(--alice-muted-light);

  /* Pills */
  --pill-bg: #eaf4fb;
  --pill-text: #264fc4;

  /* SAT */
  --sat-bg: #f6e4b5;
  --sat-text: #de511d;

  /* Hors patrimoine */
  --hp-bg: rgba(200, 14, 14, 0.12);
  --hp-text: #c80e0e;

  /* Accent / bordure / ombre */
  --accent: #5068f5;
  --border: #b0cc93;
  --shadow: rgba(0, 0, 0, 0.1);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--alice-bg-page-deep-dark);
    --card-bg: rgba(10, 18, 31, 0.92);

    --text: var(--alice-text-dark);
    --muted: var(--alice-muted-dark);

    --pill-bg: rgba(96, 165, 250, 0.14);
    --pill-text: #8fc2ff;

    --sat-bg: rgba(251, 191, 36, 0.14);
    --sat-text: #ffd38a;

    --hp-bg: rgba(248, 113, 113, 0.14);
    --hp-text: #fca5a5;

    --accent: #60a5fa;
    --border: var(--alice-line-strong-dark);
    --shadow: rgba(0, 0, 0, 0.35);
  }

  .board-header {
    background: rgba(10, 18, 31, 0.96);
    border: 1px solid var(--border);
  }

  .type-pill {
    background: rgba(148, 163, 184, 0.12);
    color: var(--text);
    border-color: var(--border);
  }

  .ville-card {
    background: rgba(148, 163, 184, 0.06) !important;
    border: 1px solid var(--border);
  }

  .board-close {
    background: rgba(148, 163, 184, 0.14);
    color: var(--text);
  }

  .board-close:hover,
  .board-close:focus-visible {
    background: rgba(148, 163, 184, 0.24);
  }

}

/* Header */
.board-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.board-main-row {
  display: flex;
  align-items: center;
  gap: 18px;
  padding-right: 34px;
}

.board-close {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  border: 0;
  background: #e5e7eb;
  color: #111827;
  text-decoration: none;
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
}

.board-close:hover {
  background: #d1d5db;
}

.board-close:focus-visible {
  background: #d1d5db;
  outline: none;
}

.board-title {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.2px;
}

.board-row {
  flex: 1 1 420px;
  min-width: 180px;
}

.board-logo {
  height: 28px;
  width: auto;
  display: block;
}

.board-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
}

#counters {
  opacity: 0.9;
}

/* Layout */
body {
  font-family: Inter, sans-serif;
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
}

@media (prefers-color-scheme: dark) {
  body {
    background: var(--alice-page-glow-dark), var(--bg);
  }
}

.board-row {
  margin-top: 0;
}

/* Liens cliquables */
.section-title,
.sat-pill {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: 0.15s;
}

/* Pills */
.pill,
.sat-pill,
.section-title,
.type-pill {
  display: inline-block;
}

.pill {
  padding: 4px 8px;
  background: var(--pill-bg);
  color: var(--pill-text);
  border-radius: 10px;
  font-size: 12px;
  margin: 4px 6px 4px 0;
  cursor: pointer;
  transition: 0.15s;
  text-decoration: none;
}

.pill:hover,
.sat-pill:hover,
.section-title:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 3px 10px var(--shadow);
}

.type-pill {
  background: #e6ecef;
  color: #3c3732;
  border: 1px solid #b0cc93;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  margin-left: 6px;
}

.sat-pill,
.section-title {
  background: var(--sat-bg);
  color: var(--sat-text);
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 10px;
  font-weight: 600;
  margin-bottom: 8px;
}

.hp .pill {
  background: var(--hp-bg);
  color: var(--hp-text);
}

/* Cartes / grille */
.post-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.card {
  background: var(--card-bg);
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 4px 12px var(--shadow);
  border: 1px solid rgba(255, 255, 255, 0.05);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.45s ease forwards;
}

.card.hp-poste{
  background: linear-gradient(135deg, #fff1f1, #ffe4e4);
  border: 1px solid #ef9a9a;
  box-shadow: 0 6px 16px rgba(200, 14, 14, 0.18);
}

@media (prefers-color-scheme: dark){
  .card.hp-poste{
    background: linear-gradient(135deg, rgba(120,20,20,0.45), rgba(80,10,10,0.35));
    border: 1px solid rgba(255,138,138,0.55);
    box-shadow: 0 6px 18px rgba(255, 80, 80, 0.18);
  }
}


.card-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 8px;
}

.rail-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.25;
}

.rail-meta-sat {
  margin: -2px 0 8px;
}

.rail-code {
  flex: 0 0 auto;
  border-radius: 999px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 700;
}

.rail-code {
  background: rgba(80, 104, 245, 0.11);
  color: var(--accent);
}

.rail-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-tooltip {
  position: fixed;
  z-index: 2000;
  max-width: min(360px, calc(100vw - 24px));
  padding: 8px 10px;
  border: 1px solid rgba(60, 55, 50, 0.18);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.96);
  color: var(--text);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
  font-size: 12px;
  line-height: 1.35;
  pointer-events: none;
}

.app-tooltip[hidden] {
  display: none;
}

.app-tooltip-status {
  color: var(--muted);
}

@media (prefers-color-scheme: dark) {
  .app-tooltip {
    background: rgba(17, 24, 39, 0.96);
    border-color: rgba(148, 163, 184, 0.35);
  }
}

.sat-block {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Recherche */
#search {
  width: 100%;
  padding: 12px 18px;
  font-size: 15px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
}

#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(80, 104, 245, 0.18);
}

/* Filtres */
.filters {
  position: sticky;
  top: var(--board-header-sticky-offset, 0px);
  z-index: 49;
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  padding: 10px 8px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px);
}

.filters > [data-tableau-filtres] { display: contents; }
.metro-controls { display: inline-flex; align-items: center; gap: 10px; }
.metro-display-controls { display: inline-flex; align-items: center; gap: 6px; }
.metro-sort-controls { display: inline-flex; align-items: center; gap: 6px; }
.metro-sort-controls[hidden], .metro-mobile-tri[hidden] { display: none; }
.metro-controls[hidden], [data-tableau-filtres][hidden] { display: none; }

.metro-mobile-menu {
  display: none;
}


.filters button {
  padding: 8px 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  cursor: pointer;
  font-weight: 600;
  color: var(--text);
  transition: all 0.15s ease;
  backdrop-filter: blur(6px);
}

.filters button:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.filters button.activeFilter {
  background: linear-gradient(135deg, #5b6eff, #5068f5);
  color: #ffffff;
  border-color: #5068f5;
  box-shadow: 0 6px 18px rgba(80, 104, 245, 0.35);
}

.view-zone {
  min-height: 120px;
  opacity: 1;
  will-change: opacity;
}

.metro-zone[hidden],
#postesZone[hidden] {
  display: none;
}

.metro-loading {
  display: grid;
  place-items: center;
  min-height: min(80vh, 680px);
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--card-bg);
  box-shadow: 0 4px 12px var(--shadow);
}

.metro-loading[hidden] { display: none; }

.metro-loading-content {
  display: grid;
  justify-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 15px;
  font-weight: 700;
}

.metro-loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid color-mix(in srgb, var(--accent) 22%, transparent);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: metroLoadingSpin .75s linear infinite;
}

@keyframes metroLoadingSpin {
  to { transform: rotate(360deg); }
}

#metroZone {
  --canvas: #fbfaf6 !important;
  background: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

#metroZone * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

#metroZone svg {
  -webkit-user-drag: none;
}

.metro-zone .map-shell {
  background-color: #fbfaf6;
  background-image: none;
  border-color: #e5e0d6;
}

#metroZone .station-label {
  font-size: 28px;
  font-weight: 650;
  stroke-width: 10px;
}

#metroZone .station.is-sst .station-label {
  font-size: 32px;
}

#metroZone .station.satellite .station-label {
  font-size: 21px;
}

#metroZone .station-sat {
  font-size: 18px;
}

#metroZone .hub .hub-title,
#metroZone .hub.junction .hub-title {
  font-size: 38px;
}

#metroZone .metro-line-name {
  font-size: 31px;
  font-weight: 800;
  letter-spacing: 0.4px;
  text-anchor: middle;
  dominant-baseline: middle;
}

#metroZone .metro-line-card {
  fill: color-mix(in srgb, var(--card-bg) 96%, #f4efe5);
  stroke: #ddd7ca;
  stroke-width: 3px;
}

#metroZone .metro-line-badge {
  fill: var(--card-bg);
  stroke-width: 5px;
}

#metroZone .map-shell.vue-ligne .station.is-line-endpoint .station-dot {
  fill: var(--card-bg);
  stroke-width: 7px;
}

#metroZone .metro-station-leader {
  stroke: var(--node-line-color);
  stroke-width: 3;
  stroke-linecap: round;
  opacity: 0.8;
}

#metroZone .linear-station-label {
  font-size: 38px !important;
}

#metroZone .station.is-sst .linear-station-label {
  font-size: 44px !important;
}

#metroZone .map-shell.vue-ligne .station.satellite .station-sat {
  font-size: 27px !important;
  font-weight: 700;
}

#metroZone .map-shell.vue-ligne .station.satellite .sat-stem {
  stroke-width: 3px;
}

#metroZone .linear-station-label {
  pointer-events: auto;
  cursor: help;
}

#metroZone .map-shell.vue-ligne {
  overflow-x: hidden;
  overflow-y: auto;
  cursor: default;
}

#metroZone .map-shell.vue-ligne .branch {
  stroke-width: 11px;
}

.metro-map-shell {
  overflow: hidden;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--card-bg);
  box-shadow: 0 4px 12px var(--shadow);
}

.metro-toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 48px;
  padding: 10px 14px;
  color: var(--muted);
  font-size: 12px;
}

.metro-toolbar strong { color: var(--text); font-size: 15px; }
.metro-toolbar label { display: inline-flex; align-items: center; gap: 6px; }
.metro-toolbar span { margin-left: auto; }
.metro-canvas-wrap { overflow: auto; max-height: min(80vh, 900px); }
.metro-map { display: block; width: 100%; min-width: 900px; min-height: 600px; touch-action: none; cursor: grab; }
.metro-map.is-panning { cursor: grabbing; }
.metro-background { fill: color-mix(in srgb, var(--card-bg) 94%, var(--accent)); }
.metro-branch { stroke-width: 8; stroke-linecap: round; opacity: .86; }
.metro-line-title { font-size: 25px; font-weight: 800; }
.metro-station { cursor: pointer; text-decoration: none; }
.metro-station circle { fill: var(--card-bg); stroke-width: 5; }
.metro-station.is-sat circle { stroke-width: 3; }
.metro-station-label {
  fill: var(--text); font-size: 15px; font-weight: 650; text-anchor: middle;
  paint-order: stroke; stroke: var(--card-bg); stroke-width: 6px; stroke-linejoin: round;
}
.metro-station-label.below { dominant-baseline: hanging; }
.metro-station:hover .metro-station-label,
.metro-station:focus-visible .metro-station-label { fill: var(--accent); }

.metro-zone [data-node-id].is-search-highlight {
  animation: metroPosteBlink 0.42s ease-in-out 3;
}

@keyframes metroPosteBlink {
  0%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.08; }
  50% { opacity: 1; }
}

@media (max-width: 600px) {
  .metro-toolbar { flex-wrap: wrap; gap: 8px 14px; }
  .metro-toolbar span { width: 100%; margin-left: 0; }
}

.pill:focus-visible,
.sat-pill:focus-visible,
.section-title:focus-visible,
.filters button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Header container */
.board-header {
  position: sticky;
  top: 0;
  z-index: 50;
  margin-bottom: 16px;
  padding: 14px;
  border-radius: 18px;
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 26px var(--shadow);
}

@media (prefers-color-scheme: dark) {
  #search,
  .filters button,
  .card {
    border-color: var(--border);
  }

  #search {
    background: rgba(148, 163, 184, 0.08);
  }

  .filters button {
    background: rgba(148, 163, 184, 0.12);
  }
}

/* Mobile */
@media (max-width: 480px) {
  .board-main-row {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
  }

  .board-row {
    flex-basis: auto;
  }

  .card {
    padding: 14px;
    border-radius: 14px;
  }

  .card-title {
    font-size: 16px;
  }

  .pill {
    font-size: 12px;
    padding: 4px 8px;
  }

  .sat-pill,
  .section-title {
    font-size: 12px;
    padding: 4px 10px;
  }
}

/* Sur telephone, la vue Metro est pilotee automatiquement par l'orientation. */
@media (hover: none) and (pointer: coarse) and (max-width: 700px) {
  [data-view="metro"] {
    display: none;
  }
}

body.metro-mobile-landscape {
  overflow: hidden;
  padding: 0;
  background: #101b2d;
}

body.metro-mobile-landscape > .board-header,
body.metro-mobile-landscape > .filters {
  display: none;
}

body.metro-mobile-landscape #viewZone,
body.metro-mobile-landscape #metroZone,
body.metro-mobile-landscape #metroZone .page,
body.metro-mobile-landscape #metroZone .map-shell {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0;
  padding: 0;
}

body.metro-mobile-landscape #viewZone,
body.metro-mobile-landscape #metroZone,
body.metro-mobile-landscape #metroLoading {
  position: fixed;
  inset: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior: none;
  touch-action: none;
}

body.metro-mobile-landscape #metroZone .map-shell {
  height: 100vh;
  height: 100dvh;
  border: 0;
  border-radius: 0;
}

body.metro-mobile-landscape #metroLoading {
  z-index: 150;
  min-height: 100dvh;
  border: 0;
  border-radius: 0;
  background: #101b2d;
}

body.metro-mobile-landscape #metroLoading .metro-loading-content {
  color: #dce8f8;
}

body.metro-mobile-landscape .metro-mobile-menu {
  position: fixed;
  z-index: 200;
  top: 0;
  right: 0;
  bottom: 0;
  display: block;
  width: min(288px, calc(100vw - 64px));
  transform: translateX(100%);
  transition: transform 180ms ease;
}

body.metro-mobile-landscape .metro-mobile-menu.is-open {
  transform: translateX(0);
}

.metro-mobile-menu-toggle {
  position: absolute;
  top: 50%;
  right: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 52px;
  padding: 0;
  transform: translateY(-50%);
  border: 1px solid rgba(148, 163, 184, 0.38);
  border-right: 0;
  border-radius: 14px 0 0 14px;
  background: rgba(15, 28, 47, 0.96);
  color: #f8fbff;
  box-shadow: -8px 6px 22px rgba(0, 0, 0, 0.28);
  font-size: 22px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.metro-mobile-menu.is-open .metro-mobile-menu-toggle-icon {
  transform: rotate(180deg);
}

.metro-mobile-menu-toggle-icon {
  display: block;
  transition: transform 180ms ease;
}

.metro-mobile-menu-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) 16px;
  overflow-y: auto;
  border-left: 1px solid rgba(148, 163, 184, 0.3);
  background: rgba(15, 28, 47, 0.97);
  color: #dce8f8;
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.34);
  overscroll-behavior: contain;
  touch-action: pan-y;
}

.metro-mobile-menu-panel strong {
  color: #f8fbff;
  font-size: 17px;
}

.metro-mobile-menu-panel label {
  color: #b8c7db;
  font-size: 12px;
  font-weight: 700;
}

.metro-mobile-help {
  margin: -3px 0 0;
  color: #9fb0c3;
  font-size: 12px;
  line-height: 1.4;
}

.metro-mobile-menu-panel input,
.metro-mobile-menu-panel button,
.metro-mobile-menu-panel a {
  width: 100%;
  min-height: 42px;
  border: 1px solid rgba(148, 163, 184, 0.36);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  color: #f8fbff;
  font: inherit;
}

.metro-mobile-menu-panel input {
  padding: 9px 11px;
  font-size: 16px;
}

.metro-mobile-menu-panel button,
.metro-mobile-menu-panel a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 750;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.metro-mobile-menu-panel button[aria-pressed="true"] {
  border-color: #60a5fa;
  background: rgba(96, 165, 250, 0.22);
}

.metro-mobile-tri {
  display: grid;
  grid-template-columns: 1fr 1fr;
